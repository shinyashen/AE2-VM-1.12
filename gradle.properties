# suppress inspection "SpellCheckingInspection" for whole file
org.gradle.jvmargs = -Xmx3G

# Source Options
# Use Modern Java(9+) Syntax (Courtesy of Jabel)
use_modern_java_syntax = true

# Compilation Options
generate_sources_jar = true
generate_javadocs_jar = false

# Testing
enable_junit_testing = true
show_testing_output = false

# Mod Information
mod_version = 0.1.0
root_package = com.ae2vm
mod_id = ae2_vm_112
mod_name = AE2 VM 1.12

mod_description = Stack-based VM crafting calculator for AE2 Extended Life, ported from AE2-VM (NeoForge 1.21).
mod_url = https://github.com/TaoLe-si/AE2-VM
mod_update_json =
mod_authors = shinyashen
mod_credits = Tao (original AE2-VM), NNYYOONNIIOO & contributors (AE2-Quick-Calculation shell), Circulate233 (build system reference)

# Mapping Properties
mapping_channel = stable
mapping_version = 39
use_dependency_at_files = true

# Run Configurations
minecraft_username = Developer
extra_jvm_args =
extra_tweak_classes =

# Modify Minecraft Sources
change_minecraft_sources = false

# Tags
use_tags = true
tag_class_name = ${root_package}.${mod_id}.Tags

# Access Transformers
use_access_transformer = false
access_transformer_locations = ${mod_id}_at.cfg

# Mixins
use_mixins = true
mixin_booter_version = 9.3
generate_mixins_json = false
mixin_configs = ae2_vm_112
mixin_refmap = mixins.ae2_vm_112.refmap.json
use_mixins_debugClassLoading = false

# Coremods
is_coremod = true
coremod_includes_mod = true
coremod_plugin_class_name = com.ae2vm.mixin.AE2VMEarlyMixinLoader

# AssetMover
use_asset_mover = false
asset_mover_version = 2.5

# Extra properties referenced by the build scripts
mixin_package = com.ae2vm.mixin

# Mod logo (empty = none; referenced by mcmod.info template)
mod_logo_path =
