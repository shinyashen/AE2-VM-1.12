name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re)publish, e.g. v1.0.0'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag
        id: ref
        run: echo "ref=${{ inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.ref.outputs.ref }}

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: ./gradlew build --no-daemon

      - name: Verify tag matches mod_version
        run: |
          TAG="${{ steps.ref.outputs.ref }}"
          VERSION=$(grep '^mod_version' gradle.properties | sed 's/^[^=]*=\s*//')
          if [ "v${VERSION}" != "${TAG}" ]; then
            echo "::error::tag ${TAG} does not match mod_version '${VERSION}'. Fix: update mod_version, commit, then retag."
            exit 1
          fi
          echo "tag ${TAG} == v${VERSION} OK"

      - name: Publish GitHub Release (create, or upload --clobber on re-run)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.ref.outputs.ref }}"
          gh release create "$TAG" build/libs/*.jar \
            --title "AE2 VM 1.12 ${TAG#v}" --generate-notes --verify-tag \
            || gh release upload "$TAG" build/libs/*.jar --clobber

      - name: Sync benchmarks to wiki
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/extract_perf.py extract --results build/test-results/test > /tmp/bench.md
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.wiki.git" /tmp/wiki
          python3 scripts/extract_perf.py inject --bench /tmp/bench.md \
            --wiki-zh /tmp/wiki/Performance.md --wiki-en /tmp/wiki/Performance-en.md \
            --tag "${{ steps.ref.outputs.ref }}" --date "$(date -u +%F)"
          cd /tmp/wiki
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "no benchmark changes" || {
            git commit -m "benchmarks: ${{ steps.ref.outputs.ref }}"
            git push
          }

      - name: Probe legacy game version IDs
        env:
          CF_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request

          token = os.environ["CF_TOKEN"]
          # Known candidates for 1.12.2 in the legacy ID space (curse.maven era)
          candidates = [69118, 74690, 7498, 8170, 7125, 7126, 4458, 69119, 7147, 7157]

          def probe(vid):
              boundary = "----aevm" + vid.__str__().replace('-', '')
              meta = json.dumps({"displayName": f"probe-v{vid}-delete-me",
                                 "releaseType": "alpha",
                                 "gameVersions": [vid],
                                 "changelog": "temporary probe; will be deleted"})
              body = (
                  f"--{boundary}\r\nContent-Disposition: form-data; name=\"metadata\"\r\n"
                  f"Content-Type: application/json\r\n\r\n{meta}\r\n"
                  f"--{boundary}--\r\n").encode()
              req = urllib.request.Request(
                  "https://minecraft.curseforge.com/api/projects/1692278/upload-file",
                  data=body, method="POST")
              req.add_header("X-Api-Token", token)
              req.add_header("Content-Type", f"multipart/form-data; boundary={boundary}")
              req.add_header("Accept", "application/json")
              try:
                  with urllib.request.urlopen(req) as r:
                      return r.status, r.read().decode()[:200]
              except urllib.error.HTTPError as e:
                  return e.code, e.read().decode(errors="replace")[:200]

          for vid in candidates:
              code, resp = probe(vid)
              print(f"id={vid} -> HTTP {code} {resp[:150]}")
          PY

      - name: Upload to CurseForge (main jar only; relations inherit the project defaults)
        env:
          CF_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          CF_PROJECT: '1692278'
          TAG: ${{ steps.ref.outputs.ref }}
        run: |
          if [ -z "${CF_TOKEN}" ]; then
            echo "CURSEFORGE_TOKEN not configured — skipping the CurseForge upload"
            exit 0
          fi
          python3 - <<'PY'
          import glob, json, os, re, sys, urllib.request

          token = os.environ["CF_TOKEN"]
          project = os.environ["CF_PROJECT"]
          version = os.environ["TAG"].removeprefix("v")

          jars = [j for j in sorted(glob.glob("build/libs/ae2_vm_112-*.jar"))
                  if "-dev" not in j and "-sources" not in j]
          if not jars:
              sys.exit("no release jar found in build/libs")
          jar = jars[0]
          display_name = f"AE2 VM 1.12 {version}"
          print(f"uploading {jar} as '{display_name}' to project {project}")

          def cf_upload(path, data=None, files=None):
              # legacy Upload API: minecraft.curseforge.com (POST-only endpoints)
              req = urllib.request.Request(f"https://minecraft.curseforge.com/api{path}")
              req.add_header("X-Api-Token", token)
              req.add_header("Accept", "application/json")
              boundary = "----aevm" + os.urandom(8).hex()
              body = b""
              if files:
                  name, (filename, content) = files
                  body += (f"--{boundary}\r\nContent-Disposition: form-data; "
                           f"name=\"{name}\"; filename=\"{filename}\"\r\n"
                           f"Content-Type: application/java-archive\r\n\r\n").encode() + content + b"\r\n"
              if data:
                  body += (f"--{boundary}\r\nContent-Disposition: form-data; "
                           f"name=\"metadata\"\r\n"
                           f"Content-Type: application/json\r\n\r\n").encode() \
                          + json.dumps(data).encode() + b"\r\n"
              body += f"--{boundary}--\r\n".encode()
              req.data = body
              req.add_header("Content-Type", f"multipart/form-data; boundary={boundary}")
              req.method = "POST"
              try:
                  with urllib.request.urlopen(req) as r:
                      return r.status, json.loads(r.read() or b"{}")
              except urllib.error.HTTPError as e:
                  return e.code, e.read().decode(errors="replace")[:400]

          def core_api(path):
              # legacy version/id endpoints live on the upload host too
              # (GET /game/versions?cache=true — same call mc-publish makes)
              req = urllib.request.Request(f"https://minecraft.curseforge.com/api{path}")
              req.add_header("X-Api-Token", token)
              req.add_header("Accept", "application/json")
              try:
                  with urllib.request.urlopen(req) as r:
                      return r.status, json.loads(r.read() or b"{}")
              except urllib.error.HTTPError as e:
                  return e.code, e.read().decode(errors="replace")[:300]

          # Idempotency: the upload host has no project GET; rely on CF's own
          # duplicate-file policy — a second upload with identical displayName
          # is rejected by the server, so a rerun cannot create a dup pair

          # Changelog: the matching CHANGELOG.md section; '# vX.Y.Z' header stripped,
          # '## Section' inlined as 'Title:', '**' removed (CF renders no Markdown there)
          text = open("CHANGELOG.md", encoding="utf-8").read()
          m = re.search(r"^# " + re.escape(version) + r"\n(.*?)(?=^# |\Z)", text, re.S | re.M)
          changelog = m.group(1) if m else ""
          changelog = re.sub(r"^## (.+)$", r"\1:", changelog, flags=re.M).replace("**", "").strip()

          # gameVersions: resolve 1.12.2's id from the live versions list
          # (GET /game/versions?cache=true — same call mc-publish makes)
          status, versions = core_api("/game/versions?cache=true")
          if status != 200:
              print(f"versions fetch HTTP {status}: {versions}")
              sys.exit("cannot resolve the 1.12.2 game version id")
          ids = [v["id"] for v in versions if v.get("name") == "1.12.2"]
          if not ids:
              sys.exit(f"1.12.2 not in the version list (raw={str(versions)[:200]})")
          # The upload API validates gameVersions against ALL required groups at
          # once (per mc-publish: game ids + loader id + environment id + java id):
          # - Forge (the loader group)
          # - Java 8 (the environment group — the mod ships release-8 bytecode)
          forge = [v["id"] for v in versions if v.get("name") == "Forge"]
          java8 = [v["id"] for v in versions if v.get("name") == "Java 8"]
          if not forge or not java8:
              sys.exit(f"Forge/Java 8 not found (forge={forge}, java8={java8})")
          # diagnostic: save the full version list for offline inspection
          open("build/cf-versions.json", "w").write(json.dumps(versions)[:200000])
          javaish = [(v["id"], v.get("name")) for v in versions
                     if "java" in str(v.get("name", "")).lower() or v.get("name") in ("8", "11", "17", "21")]
          print("java-ish entries:", javaish)
          ids = ids + forge[:1] + java8[:1]
          print(f"1.12.2={ids[0]}, Forge={forge[0]}, Java 8={java8[0]}")

          # metadata shape per mc-publish's packCurseForgeVersionInit —
          # camelCase: changelog/changelogType/displayName/gameVersions/releaseType
          # (relations omitted — CF project defaults apply)
          meta = {"changelog": changelog,
                  "changelogType": "markdown",
                  "displayName": display_name,
                  "gameVersions": ids,
                  "environments": ["Client", "Server"],
                  "releaseType": "release"}
          status, result = cf_upload(f"/projects/{project}/upload-file",
              data=meta,
              files=("file", (os.path.basename(jar), open(jar, "rb").read())))
          print(f"CurseForge upload HTTP {status}")
          print(result if isinstance(result, str) else json.dumps(result)[:400])
          if status not in (200, 201):
              print("::warning::CurseForge upload failed"); sys.exit(1)
          PY

      - name: Upload diagnostics (cf-versions.json; temporary)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cf-versions
          path: build/cf-versions.json
          if-no-files-found: ignore

      - name: Verify CurseForge token reachability (legacy probe; superseded by the upload step)
        continue-on-error: true
        run: |
          if [ -z "${{ secrets.CURSEFORGE_TOKEN }}" ]; then
            echo "CURSEFORGE_TOKEN not configured, skipping"
            exit 0
          fi
          code=$(curl -s -o /tmp/cf.json -w "%{http_code}" \
            -H "x-api-key: ${{ secrets.CURSEFORGE_TOKEN }}" \
            -H "Accept: application/json" \
            https://api.curseforge.com/v1/games/432)
          echo "CurseForge API HTTP ${code} (200 = token valid from US runner)"
          [ "$code" = "200" ] && head -c 300 /tmp/cf.json || true
