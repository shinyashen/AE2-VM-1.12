name: ✨ Feature request / 功能建议
description: Suggest an idea for this project / 提出新功能或改进建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        **English** — Describe the feature and the problem it solves; write in whichever language you prefer.
        **中文** — 描述功能建议以及它解决的问题,使用你习惯的语言即可。
  - type: textarea
    id: problem
    attributes:
      label: Problem / 问题或动机
      description: What crafting scenario is hard or impossible today? / 目前哪个合成场景难以处理或无法处理?
      placeholder: |
        e.g. A pattern setup where the plan is wrong or the calculator stalls. /
        例如:某种样板配置下计算结果不对或计算卡住。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution / 建议方案
      description: What would you like the VM to do? / 希望 VM 如何处理?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives / 替代方案
      description: Other workarounds you have tried / 你尝试过的其他解决方式
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: AE2 VM 1.12 version / AE2 VM 1.12 版本
      placeholder: e.g. 1.1.0 / 例如 1.1.0
    validations:
      required: false
  - type: textarea
    id: extra
    attributes:
      label: Additional context / 补充信息
    validations:
      required: false
