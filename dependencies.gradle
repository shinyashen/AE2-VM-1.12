dependencies {
    // Include StripLatestForgeRequirements by default for the dev env, saves everyone a hassle
    runtimeOnly 'com.cleanroommc:strip-latest-forge-requirements:1.0'
    // Include OSXNarratorBlocker by default for the dev env, for M1+ Macs
    runtimeOnly 'com.cleanroommc:osxnarratorblocker:1.0'

    // AE2 Extended Life v0.56.7 (latest 1.12.2 release, compile baseline).
    // Runtime range: every published AE2UEL build works, from the first
    // CurseForge upload (rv6-stable-7-extended_life-v49t, 2022-01) through
    // v0.56.7 — verified member-by-member against the AE2UEL git history.
    implementation(rfg.deobf("curse.maven:ae2-extended-life-570458:6302098"))
    // AE2 Fluid Craft Rework (AE2-UEL org build, 2.6.6-r) - the primary
    // compat target for fluid (fake item) pattern support. The API surface the
    // compat layer uses (FakeFluids / FakeItemRegister / FCItems.FLUID_DROP,
    // com.glodblock packages) is identical in the Circulate233 unofficial fork,
    // so a runtime install of either fork is supported.
    implementation(rfg.deobf("curse.maven:ae2-fluid-crafting-rework-623955:5751930"))
    // AE2 Crafting Tree Legacy - crafting tree visualization compat
    implementation(rfg.deobf("curse.maven:ae2-crafting-tree-legacy-1121489:5814089"))
    // Baubles - AE2UEL's patched Item class references it; tests need it on the classpath
    testImplementation(rfg.deobf("curse.maven:baubles-227083:2518667"))
    // Trace schema JSON (diagnostics groundwork). Vanilla 1.12.2 ships gson
    // 2.8.0 at runtime — compile against 2.8.9 (API compatible), runtime is
    // provided by MC; the standalone replay artifact bundles its own copy.
    compileOnly 'com.google.code.gson:gson:2.8.9'
    testImplementation 'com.google.code.gson:gson:2.8.9'
}
